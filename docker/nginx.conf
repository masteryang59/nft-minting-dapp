server {
  listen 80;
  root /usr/share/nginx/html;

  # Written by the deploy service; never cache it, so a redeploy shows up on reload.
  location = /deployment.json {
    alias /deployments/deployment.json;
    add_header Cache-Control "no-store";
  }

  location /collection/ {
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri /index.html;
  }
}
